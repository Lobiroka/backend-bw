name: Suíte de Testes - SUT API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
    # Opcional, caso use banco local no docker-compose,
    # mas o passo abaixo já sobe o compose geral.

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir infraestrutura (Docker Compose)
        run: docker compose up -d

      - name: Demand Service - Instalação
        working-directory: ./demand-service
        run: npm install

      - name: Aguardar banco de dados ficar pronto
        run: sleep 5

      - name: Configurar Banco de Testes (Prisma)
        working-directory: ./demand-service
        run: npx prisma db push

      - name: Executar testes automatizados (Vitest)
        working-directory: ./demand-service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: 'smartcity-dev-secret
        run: npx vitest run

